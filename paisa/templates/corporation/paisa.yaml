# Paisa template for a BC corporation — copy this folder into ${VOL_PATH:-/data}/paisa (git repo)
# Fill in the TODOs here and in accounts.ledger, then start recording in the year file.
# Reference: https://paisa.fyi/reference/config/

# Relative paths resolve from this file's directory (in git)
journal_path: main.ledger
sheets_directory: sheets

# Database sits next to this file; .gitignore keeps it out of git
db_path: paisa.db

# ledger | hledger | beancount (hledger/beancount need the matching image tag)
ledger_cli: ledger

# Upstream defaults are tuned for India (INR / en-IN / April FY)
default_currency: CAD
locale: en-US
time_zone: America/Vancouver
display_precision: 2
amount_alignment_column: 52
# TODO: month your fiscal year starts (1 = January, for a December 31 year end)
financial_year_starting_month: 1
week_starting_day: 0

# Accounts and commodities are declared in accounts.ledger; typos become errors
strict: "yes"

budget:
  rollover: "yes"

# Empty = no login. Add users to enable auth; password is sha256 hashed twice:
#   echo -n 'ChangeThisPassword' | sha256sum | head -c 64 | sha256sum | head -c 64
user_accounts: []
#  - username: admin
#    password: sha256:<hash>

accounts:
  - name: Assets:Bank:Chequing
    icon: mdi:bank
  - name: Equity:ShareCapital
    icon: mdi:account-group
  - name: Liabilities:CreditCard
    icon: mdi:credit-card
  - name: Income:Sales
    icon: mdi:cash-register

goals:
  retirement: []
  savings: []
#    - name: Emergency Fund
#      icon: mdi:piggy-bank
#      target: 10000
#      target_date: "2027-12-31"
#      accounts:
#        - Assets:Bank:Savings

schedule_al:
  - code: bank
    accounts:
      - Assets:Bank:*
  - code: cash
    accounts:
      - Assets:Cash
  - code: loan
    accounts:
      - Liabilities:Loan:*

allocation_targets: []
commodities: []
import_templates: []
credit_cards: []
