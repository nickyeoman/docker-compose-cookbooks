services:
  prowlarr:
    image: ${PROWLARR_IMAGE:-ghcr.io/hotio/prowlarr:release}
    restart: ${PROWLARR_RESTART:-unless-stopped}
    volumes:
      - ${VOL_PATH:-/data}/prowlarr/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
    ports:
      - "${PROWLARR_PORT:-9696}:9696"
    networks:
      - proxy
      - internal
    depends_on:
      - flaresolverr

  flaresolverr:
    image: ${FLARESOLVERR_IMAGE:-ghcr.io/flaresolverr/flaresolverr:latest}
    restart: ${FLARESOLVERR_RESTART:-unless-stopped}
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ:-America/Vancouver}
    networks:
      - internal

networks:
  proxy:
    external: true
  internal:
    driver: bridge
