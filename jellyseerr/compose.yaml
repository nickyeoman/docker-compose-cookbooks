services:
  jellyseerr:
    image: ${JELLYSEERR_IMAGE:-ghcr.io/seerr-team/seerr:latest}
    restart: ${JELLYSEERR_RESTART:-unless-stopped}
    volumes:
      - ${VOL_PATH:-/data}/jellyseerr/config:/app/config
    environment:
      - PUID=1000
      - PGID=1000
      - UMASK=002
      - TZ=${TZ:-America/Vancouver}
    ports:
      - "${JELLYSEERR_PORT:-5055}:5055"
    networks:
      - proxy

networks:
  proxy:
    external: true
